aid: xag
name: XAG
description: 'XAG (Guangzhou, China) is an agricultural technology company building
  autonomous farming solutions: agricultural drones (P150 Max, P150, P100 Pro, P60),
  R100/R200 agricultural ground rovers, the APC2 AutoPilot console, and smart-farm
  IoT devices. Backed by SoftBank Vision Fund. XAG operates a Chinese-language developer
  Open Platform (open.xa.com) that integrates application management, device data
  authorization, secure data communication, and message subscription, providing APIs
  for second-party development on XAG products; public API documentation is still
  largely unpublished.'
